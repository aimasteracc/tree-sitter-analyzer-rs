name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fixtures-smoke:
    name: Fixtures smoke (must pass)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test fixtures_smoke --no-fail-fast

  contract-status:
    name: Contract tests pending list
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Per-test pending vs implemented gate
        run: python3 tools/check_contract_status.py
